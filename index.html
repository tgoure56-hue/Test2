/* ============================================================
   VERSION NOIRE — mini-RPG de créatures jouable au navigateur
   Hommage original (créatures & graphismes inédits).
   ============================================================ */
'use strict';

const TILE = 16;            // taille d'une case en pixels logiques
const VIEW_W = 16;          // cases visibles en largeur  (256 px)
const VIEW_H = 14;          // cases visibles en hauteur  (224 px)
const SCR_W = VIEW_W * TILE;
const SCR_H = VIEW_H * TILE;

// ---------- utilitaires ----------
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rndi  = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
// petit hash déterministe pour décorer les tuiles
function thash(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

// ---------- entrées clavier ----------
// e.code = position physique : KeyW/KeyA/KeyS/KeyD couvrent WASD et ZQSD.
const held = new Set();
let keyResolver = null;          // résolveur en attente (dialogues/menus)
const ACTION_KEYS = ['Enter', 'Space', 'KeyE'];
const CANCEL_KEYS = ['Escape', 'KeyX', 'Backspace'];

function dirOfCode(c) {
  if (c === 'ArrowUp'    || c === 'KeyW') return 'up';
  if (c === 'ArrowDown'  || c === 'KeyS') return 'down';
  if (c === 'ArrowLeft'  || c === 'KeyA') return 'left';
  if (c === 'ArrowRight' || c === 'KeyD') return 'right';
  return null;
}

function onKeyDown(e) {
  if (e.repeat) { if (dirOfCode(e.code)) e.preventDefault(); return; }
  ensureAudio();
  if (e.code === 'KeyM') { toggleMusic(); e.preventDefault(); return; }
  held.add(e.code);
  if (keyResolver) {
    const r = keyResolver;
    const d = dirOfCode(e.code);
    let sym = null;
    if (ACTION_KEYS.includes(e.code)) sym = 'ok';
    else if (CANCEL_KEYS.includes(e.code)) sym = 'cancel';
    else if (d) sym = d;
    if (sym) { keyResolver = null; r(sym); e.preventDefault(); return; }
  }
  if (G.state === 'world' && !busy && !UI.dialog && !UI.menu && pressQueue.length < 3) pressQueue.push(e.code);
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code)) e.preventDefault();
}
function onKeyUp(e) { held.delete(e.code); }

// attend une touche « significative » (ok / cancel / direction)
function waitKey() { return new Promise(res => { keyResolver = res; }); }
function heldDir() {
  for (const c of ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD']) {
    if (held.has(c)) return dirOfCode(c);
  }
  return null;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function nextFrame() { return new Promise(r => requestAnimationFrame(() => r())); }

/* ============================================================
   AUDIO — petit moteur chiptune (WebAudio), touche M pour couper
   ============================================================ */
let actx = null, musicOn = true, musicTimer = null;
let curTrack = null, trackPos = 0, nextNoteTime = 0;

function ensureAudio() {
  if (!actx && (window.AudioContext || window.webkitAudioContext)) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    startMusicLoop();
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function midi2freq(n) { return 440 * Math.pow(2, (n - 69) / 12); }

function blip(freq, dur, type, vol, when) {
  if (!actx) return;
  const t = when !== undefined ? when : actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square'; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || 0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}

// pistes : [note midi (0 = silence), durée en doubles-croches]
const TRACKS = {
  // ambiance bourg/route — gaie, pentatonique
  world: { tempo: 132, bass: true, notes: [
    [72,2],[76,2],[79,2],[76,2],[81,4],[79,2],[76,2],

  // combat — tendue, mineure
  battle: { tempo: 168, bass: true, notes: [
    [69,1],[0,1],[69,1],[72,1],[74,2],[72,1],[69,1],
    [67,2],[69,2],[72,2],[69,2],
    [69,1],[0,1],[69,1],[72,1],[76,2],[74,1],[72,1],
    [74,2],[72,2],[69,2],[65,2],
  ]},
  // écran titre — solennelle
  title: { tempo: 100, bass: false, notes: [
    [57,4],[60,4],[64,6],[62,2],[60,4],[57,4],[55,8],
    [57,4],[60,4],[64,6],[67,2],[69,8],[0,4],
  ]},
};

function setTrack(name) {
  curTrack = name ? TRACKS[name] : null;
  trackPos = 0;
  if (actx) nextNoteTime = actx.currentTime + 0.05;
}
function startMusicLoop() {
  if (musicTimer) return;
  nextNoteTime = actx.currentTime + 0.1;
  musicTimer = setInterval(() => {
    if (!musicOn || !curTrack || !actx) return;
    const spb = 60 / curTrack.tempo / 4; // durée d'une double-croche
    while (nextNoteTime < actx.currentTime + 0.35) {
      const [n, d] = curTrack.notes[trackPos];
      if (n > 0) {
        blip(midi2freq(n), d * spb * 0.9, 'square', 0.035, nextNoteTime);
        if (curTrack.bass) blip(midi2freq(n - 24), d * spb * 0.9, 'triangle', 0.05, nextNoteTime);
      }
      nextNoteTime += d * spb;
      trackPos = (trackPos + 1) % curTrack.notes.length;
    }
  }, 90);
}
function toggleMusic() { musicOn = !musicOn; toast(musicOn ? 'Musique : ON  (M)' : 'Musique : OFF  (M)'); }

  levelup:() => { if (!actx) return; const t = actx.currentTime; [523, 659, 784, 1047].forEach((f, i) => blip(f, 0.09, 'square', 0.05, t + i * 0.07)); },
  heal:   () => { if (!actx) return; const t = actx.currentTime; [784, 988, 1175, 1568].forEach((f, i) => blip(f, 0.12, 'sine', 0.06, t + i * 0.09)); },
  throwB: () => blip(520, 0.12, 'sine', 0.06),
  tick:   () => blip(740, 0.04, 'square', 0.04),
  catchOk:() => { if (!actx) return; const t = actx.currentTime; [659, 784, 1047, 1319].forEach((f, i) => blip(f, 0.1, 'square', 0.05, t + i * 0.08)); },
  flee:   () => blip(300, 0.18, 'sine', 0.06),
};

/* ============================================================
   SPRITES — pixel-art 16x16 encodé en chaînes (1 char = 1 px)
   ============================================================ */
function drawSprite(ctx, mat, pal, x, y, scale, flip) {
  scale = scale || 1;
  for (let r = 0; r < mat.length; r++) {
    const row = mat[r];
    for (let c = 0; c < row.length; c++) {
      const ch = flip ? row[row.length - 1 - c] : row[c];
      const col = pal[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
    }
  }
}

// ---------- instances de créatures ----------
function statOf(base, level, isHp) {
  if (isHp) return Math.floor(2 * base * level / 100) + level + 10;
  return Math.floor(2 * base * level / 100) + 5;
}
function xpTotalFor(level) { return level * level * level; }

function movesAtLevel(spId, level) {
  const list = SPECIES[spId].learn.filter(([l]) => l <= level).map(([, m]) => m);
  return list.slice(-4);
}
function makeMon(spId, level) {
  const sp = SPECIES[spId];
  const m = {
    sp: spId, level, st: null,
    xp: xpTotalFor(level),
    moves: movesAtLevel(spId, level),
    hp: 0, maxhp: 0, atk: 0, def: 0, spe: 0,
  };
  recalcStats(m);
  m.hp = m.maxhp;
  return m;
}
function recalcStats(m) {
  const b = SPECIES[m.sp].base;
  m.maxhp = statOf(b.hp, m.level, true);
  m.atk = statOf(b.atk, m.level);
  m.def = statOf(b.def, m.level);
  m.spe = statOf(b.spe, m.level);
}
function monName(m) { return SPECIES[m.sp].name; }

/* ============================================================
   CARTE DU MONDE — Bourg Sépia (sud), Route 1, Lac Onyx (nord)
   '#' arbre  '.' herbe  ',' fleurs  ':' chemin  ';' hautes herbes
   '~' eau  '=' barrière  'S' panneau
   ============================================================ */
const MAP_W = 624, MAP_H = 60;
const M = Array.from({ length: MAP_H }, () => Array(MAP_W).fill('.'));
function mrect(x, y, w, h, ch) {
  for (let j = y; j < y + h; j++)
    for (let i = x; i < x + w; i++)
      if (i >= 0 && j >= 0 && i < MAP_W && j < MAP_H) M[j][i] = ch;
}
(function buildMap() {
  // bordure d'arbres
  mrect(0, 0, MAP_W, 1, '#'); mrect(0, MAP_H - 1, MAP_W, 1, '#');
  mrect(0, 0, 1, MAP_H, '#'); mrect(MAP_W - 1, 0, 1, MAP_H, '#');
  mrect(0, 0, MAP_W, 2, '#'); // lisière nord épaisse

  // ---- LAC ONYX (lignes 2..16) ----
  mrect(6, 4, 13, 9, '~');                 // le lac
  mrect(24, 3, 12, 12, ';');               // hautes herbes de l'est
  mrect(2, 2, 3, 3, '#'); mrect(2, 9, 2, 6, '#');
  mrect(36, 2, 3, 5, '#');
  mrect(19, 2, 2, 15, ':');                // sentier du lac
  mrect(8, 2, 9, 2, '.');                  // rive nord (où rôde l'ombre)
  M[16][22] = 'S';                          // panneau du lac

  // séparation lac / route (passage en 19-20)
  mrect(1, 17, 18, 1, '#'); mrect(21, 17, 18, 1, '#');

  // ---- ROUTE 1 (lignes 18..44) ----
  mrect(19, 18, 2, 28, ':');               // chemin principal
  mrect(24, 19, 9, 3, ';');                // herbes nord-est
  mrect(6, 22, 10, 6, ';');                // herbes ouest
  mrect(5, 38, 10, 5, ';');                // herbes sud-ouest
  mrect(24, 32, 10, 4, ';');               // herbes sud-est
  mrect(1, 36, 12, 1, '#');                // ligne d'arbres
  mrect(23, 30, 14, 1, '#');               // ligne d'arbres
  mrect(13, 20, 1, 6, '#'); mrect(34, 22, 4, 6, '#');
  mrect(2, 30, 6, 2, '#'); mrect(28, 40, 8, 2, '#');
  mrect(15, 33, 4, 1, '='); mrect(21, 33, 2, 1, '=');
  mrect(15, 26, 4, 1, '='); mrect(21, 26, 2, 1, '=');
  M[43][21] = 'S';                          // panneau de la route
  mrect(3, 19, 2, 2, ','); mrect(35, 36, 3, 2, ',');

  // séparation route / bourg (passage en 19-20)
  mrect(1, 45, 18, 1, '#'); mrect(21, 45, 18, 1, '#');

  // ---- BOURG SÉPIA (lignes 46..58) ----
  mrect(19, 46, 2, 8, ':');                // entrée du bourg
  mrect(9, 52, 20, 2, ':');                // place centrale
  mrect(4, 54, 3, 2, ','); mrect(31, 47, 4, 2, ','); mrect(13, 47, 3, 1, ',');
  mrect(33, 53, 4, 3, '#'); mrect(2, 46, 2, 3, '#');
  M[53][22] = 'S';                          // panneau du bourg

  // mur est de la région d'origine, passage vers l'est en (39,33-34)
  mrect(39, 1, 1, 59, '#');
  M[33][39] = ':'; M[34][39] = ':';
  M[32][37] = 'S';                          // panneau du passage
})();

/* ---- helpers de construction des nouvelles zones ---- */
function vwall(x, openRows) {
  mrect(x, 1, 1, 58, '#');
  for (const r of openRows) M[r][x] = ':';
}
function hpath(x0, x1, rows) {
  for (const r of rows) for (let x = x0; x <= x1; x++) M[r][x] = ':';
}

function tileAt(x, y) {
  if (x < 0 || y < 0 || x >= MAP_W || y >= MAP_H) return '#';
  return M[y][x];
}
function buildingAt(x, y) {
  return BUILDINGS.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h);
}
function npcAt(x, y) {
  return NPCS.find(n => n.x === x && n.y === y && npcVisible(n));
}
function npcVisible(n) {
  if (n.dragon === 'auryon') return G.flags.champion && !G.flags.auryonDone;
  if (n.dragon === 'mnemos') return G.flags.dragonDone && !G.flags.mnemosDone;
  if (n.dragon) return G.flags.erebeBeaten && !G.flags.dragonDone;
  if (n.erebe) return G.flags.zoeBeaten;
  if (n.guard) return badgeCount() < n.guard.need;
  if (n.trainer && n.vanish && G.flags[n.trainer.flag]) return false;
  return true;
}
function isBlocked(x, y) {
  const t = tileAt(x, y);
  if (t === '#' || t === '~' || t === '=' || t === 'S' || t === 'l') return true;
  if (buildingAt(x, y)) return true;
  if (npcAt(x, y)) return true;
  return false;
}

function markSeen(sp) { if (!G.seen.includes(sp)) G.seen.push(sp); }
function markCaught(sp) { markSeen(sp); if (!G.caught.includes(sp)) G.caught.push(sp); }
function badgeCount() { let n = 0; for (let i = 1; i <= 8; i++) if (G.flags['badge' + i]) n++; return n; }
const SAVE_KEY = 'version-noire-save-v1';
let memSave = null;            // repli si le stockage du navigateur est bloqué
let storageWarned = false;
function saveBlob() {
  return JSON.stringify({
    px: G.px, py: G.py, dir: G.dir, team: G.team, bag: G.bag,
    flags: G.flags, stored: G.stored, money: G.money, heal: G.heal,
    seen: G.seen, caught: G.caught,
  });
}
function saveGame() {
  const blob = saveBlob();
  memSave = blob;
  try { localStorage.setItem(SAVE_KEY, blob); return true; }
  catch (e) {
    if (!storageWarned) { storageWarned = true; toast('Stockage bloqué — utilise CODE SECRET !'); }
    return false;
  }
}
function readSave() {
  try { const s = localStorage.getItem(SAVE_KEY); if (s) return s; } catch (e) {}
  return memSave;
}
function applySaveData(d) {
  if (!d || !d.team || !d.team.length) return false;
  Object.assign(G, { px: d.px, py: d.py, dir: d.dir, team: d.team,
    bag: Object.assign({ caps: 5, pot: 3, spot: 0, guer: 0, bonbon: 0 }, d.bag),
    flags: d.flags || { pickups: {} }, stored: d.stored || [],
    money: d.money == null ? 600 : d.money,
    heal: d.heal || { x: 9, y: 53 },
    seen: d.seen || [], caught: d.caught || [] });
  if (!G.flags.pickups) G.flags.pickups = {};
  G.team.forEach(m => { if (m.st === undefined) m.st = null; });
  G.moving = null;
  return true;
}
function loadGame() {
  try { return applySaveData(JSON.parse(readSave())); } catch (e) { return false; }
}
function hasSave() { return !!readSave(); }
// code secret : sauvegarde encodée en base64, copiable d'un appareil à l'autre
function exportCode() {
  try { return btoa(unescape(encodeURIComponent(saveBlob()))); } catch (e) { return null; }
}
function importCode(code) {
  try { return applySaveData(JSON.parse(decodeURIComponent(escape(atob(code.trim()))))); }
  catch (e) { return false; }
}
function saveSummary() {
  try {
    const d = JSON.parse(readSave());
    if (!d || !d.team || !d.team.length) return null;
    let badges = 0; for (let i = 1; i <= 8; i++) if (d.flags && d.flags['badge' + i]) badges++;
    return { zone: zoneAt(d.px, d.py), badges, team: d.team.length, lvl: Math.max(...d.team.map(m => m.level)) };
  } catch (e) { return null; }
}

// ---------- interface ----------
const UI = { dialog: null, menu: null, toast: null };
const pressQueue = [];

function wrapText(text, maxChars) {
  const out = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const word of para.split(' ')) {
      if ((line + ' ' + word).trim().length > maxChars) { out.push(line); line = word; }
      else line = (line ? line + ' ' : '') + word;
    }
    out.push(line);
  }
  return out;
}

// affiche un texte façon machine à écrire ; touche = accélérer puis fermer
async function say(text) {
  const lines = wrapText(text, 38);
  // par paquets de 2 lignes
  for (let i = 0; i < lines.length; i += 2) {
    const chunk = lines.slice(i, i + 2).join('\n');
    UI.dialog = { text: chunk, shown: 0, more: i + 2 < lines.length };
    const tick = setInterval(() => {
      if (UI.dialog) { UI.dialog.shown += 1; if (chance(0.5)) SFX.tick(); }
    }, 28);
    while (true) {
      const k = await waitKey();
      if (!UI.dialog) break;
      if (UI.dialog.shown < chunk.length) { UI.dialog.shown = chunk.length; continue; }
      if (k === 'ok' || k === 'cancel') break;
    }
    clearInterval(tick);
  }
  UI.dialog = null;
}

// menu naviguable ; renvoie l'indice choisi, ou -1 si annulable et annulé
async function menu(options, opts) {
  opts = opts || {};
  UI.menu = { options, idx: opts.idx || 0, cols: opts.cols || 1,
              x: opts.x, y: opts.y, w: opts.w, title: opts.title || null };
  const m = UI.menu;
  while (true) {
    const k = await waitKey();
    const rows = Math.ceil(options.length / m.cols);
    let r = Math.floor(m.idx / m.cols), c = m.idx % m.cols;
    if (k === 'up') r = (r + rows - 1) % rows;
    else if (k === 'down') r = (r + 1) % rows;
    else if (k === 'left') c = (c + m.cols - 1) % m.cols;
    else if (k === 'right') c = (c + 1) % m.cols;
    else if (k === 'ok') { SFX.confirm(); UI.menu = null; return m.idx; }
    else if (k === 'cancel') {
      if (opts.cancelable !== false) { UI.menu = null; return -1; }
      continue;
    }
    const ni = r * m.cols + c;
    if (ni < options.length) { if (ni !== m.idx) SFX.select(); m.idx = ni; }
  }
}

function toast(text) { UI.toast = { text, t: 130 }; }

function drawWorld() {
  const pp = playerPixelPos();
  let camX = Math.round(clamp(pp.x + 8 - SCR_W / 2, 0, MAP_W * TILE - SCR_W));
  let camY = Math.round(clamp(pp.y + 8 - SCR_H / 2, 0, MAP_H * TILE - SCR_H));
  const x0 = Math.floor(camX / TILE), y0 = Math.floor(camY / TILE);
  for (let j = y0; j <= y0 + VIEW_H; j++)
    for (let i = x0; i <= x0 + VIEW_W; i++)
      drawTile(tileAt(i, j), i * TILE - camX, j * TILE - camY, i, j);

  for (let k = 0; k < PICKUPS.length; k++)
    if (!G.flags.pickups[k]) drawPickup(PICKUPS[k], camX, camY);
  for (const b of BUILDINGS) drawBuilding(b, camX, camY);

  // entités triées par y pour la superposition
  const ents = [];
  for (const n of NPCS) {
    if (!npcVisible(n)) continue;
    ents.push({ y: n.y * TILE, draw: () => {
      const ex = n.x * TILE - camX, ey = n.y * TILE - camY;
      if (n.dragon) {
        const hov = Math.floor(G.animT / 25) % 2;
        const ds = SPR[n.dragon] || SPR.noctyran;
        ctx.fillStyle = n.dragon === 'auryon' ? 'rgba(255,240,180,0.4)' : 'rgba(20,10,40,0.45)';
        ctx.beginPath(); ctx.ellipse(ex + 8, ey + 14, 8, 3, 0, 0, Math.PI * 2); ctx.fill();
        drawSprite(ctx, ds.mat, ds.pal, ex, ey - 4 - hov, 1, false);
      } else {
        drawHumanAt(ex, ey, n.dir, n.pal, false);
      }
    }});
  }
  const bob = G.moving && G.moving.t > 0.25 && G.moving.t < 0.75;
  ents.push({ y: pp.y, draw: () => drawHumanAt(pp.x - camX, pp.y - camY, G.dir, PAL_PLAYER, bob) });
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) e.draw();

  // ambiance lumineuse de la région
  const th = themeAt(G.px);
  let vig = 0.16;
  if (th === THEMES.cave) vig = 0.5;
  else if (th === THEMES.dark) vig = 0.55;
  else if (th === THEMES.volcano) vig = 0.34;

  gradV.addColorStop(0, 'rgba(0,0,0,0)');
  gradV.addColorStop(1, 'rgba(4,4,18,' + vig + ')');
  ctx.fillStyle = gradV; ctx.fillRect(0, 0, SCR_W, SCR_H);
  if (th === THEMES.snow) { ctx.fillStyle = 'rgba(210,235,255,0.07)'; ctx.fillRect(0, 0, SCR_W, SCR_H); }
  if (th === THEMES.volcano) { ctx.fillStyle = 'rgba(255,90,30,0.05)'; ctx.fillRect(0, 0, SCR_W, SCR_H); }
}

  const x = m.x !== undefined ? m.x : SCR_W - w - 4;
  const y = m.y !== undefined ? m.y : 4;
  drawBox(x, y, w, h);
  let oy = y + 8;
  if (m.title) { drawText(m.title, x + 10, oy, '#9ad8ff'); oy += 12; }
  m.options.forEach((opt, i) => {
    const r = Math.floor(i / m.cols), c = i % m.cols;
    const ox = x + 8 + c * cellW, oyy = oy + r * 13;
    if (i === m.idx) drawText('►', ox, oyy, '#f8d048');
    drawText(opt, ox + 8, oyy, i === m.idx ? '#fff' : '#c8c8d0');
  });
}
function drawToastUI() {
  if (!UI.toast) return;
  const t = UI.toast;
  const w = t.text.length * 6 + 16;
  drawBox(Math.floor((SCR_W - w) / 2), 4, w, 18);
  drawText(t.text, Math.floor((SCR_W - w) / 2) + 8, 9, '#f8d048');
  if (--t.t <= 0) UI.toast = null;
}
function drawHPBar(x, y, w, ratio, showBg) {
  ratio = clamp(ratio, 0, 1);
  if (showBg !== false) { ctx.fillStyle = '#0a0a10'; ctx.fillRect(x - 1, y - 1, w + 2, 6); }
  ctx.fillStyle = '#33333e'; ctx.fillRect(x, y, w, 4);
  const col = ratio > 0.5 ? '#48d860' : (ratio > 0.2 ? '#f8c030' : '#f04038');
  const fw = Math.round(w * ratio);
  ctx.fillStyle = col; ctx.fillRect(x, y, fw, 4);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(x, y, fw, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x, y + 3, fw, 1);
}

let titleParts = null;
function drawTitle() {
  ctx.fillStyle = '#07070c'; ctx.fillRect(0, 0, SCR_W, SCR_H);
  // étoiles fixes
  for (let i = 0; i < 40; i++) {
    const hx = thash(i, 7), hy = thash(i, 13);
    const tw = 0.25 + 0.55 * Math.abs(Math.sin(G.animT / 30 + i));
    ctx.fillStyle = 'rgba(200,200,255,' + (tw * (0.25 + hy * 0.4)).toFixed(2) + ')';
    ctx.fillRect(Math.floor(hx * 256), Math.floor(hy * 150), 1, 1);
  }
  // halo du dragon
  const g = ctx.createRadialGradient(128, 78, 6, 128, 78, 95);
  g.addColorStop(0, 'rgba(140,50,190,0.5)');
  g.addColorStop(0.6, 'rgba(80,30,120,0.22)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, SCR_W, SCR_H);
  // braises montantes
  if (!titleParts) {
    titleParts = [];
    for (let i = 0; i < 26; i++) titleParts.push({ x: Math.random() * 256, y: Math.random() * 224,
      v: 0.15 + Math.random() * 0.4, c: Math.random() < 0.6 ? '#9a5af0' : '#f0784a', s: Math.random() < 0.3 ? 2 : 1 });
  }
  for (const p of titleParts) {
    p.y -= p.v; p.x += Math.sin((G.animT + p.y) / 40) * 0.18;
    if (p.y < -2) { p.y = 226; p.x = Math.random() * 256; }
    ctx.globalAlpha = 0.35 + 0.3 * Math.sin(G.animT / 20 + p.x);
    ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
    ctx.globalAlpha = 1;
  }
  // la légende plane
  const hov = Math.sin(G.animT / 26) * 3;
  ctx.fillStyle = 'rgba(20,8,40,0.5)';
  ctx.beginPath(); ctx.ellipse(128, 122, 30, 6, 0, 0, Math.PI * 2); ctx.fill();
  drawSprite(ctx, SPR.noctyran.mat, SPR.noctyran.pal, 128 - 40, 38 + hov, 5, false);
  // yeux qui s'allument par instant
  if (Math.floor(G.animT / 90) % 3 === 0) {
    ctx.fillStyle = 'rgba(255,60,80,0.8)';
    ctx.fillRect(128 - 40 + 3 * 5, 38 + hov + 6 * 5, 5, 5);
    ctx.fillRect(128 - 40 + 10 * 5, 38 + hov + 6 * 5, 5, 5);
  }
  ctx.textAlign = 'center';
  drawText('CRÉATURES', 128, 128, '#8a8aa0', 'bold 12px monospace');
  const pulse = 0.85 + 0.15 * Math.sin(G.animT / 22);
  ctx.save();
  ctx.shadowColor = 'rgba(160,80,220,' + pulse.toFixed(2) + ')';
  ctx.shadowBlur = 12;
  drawText('VERSION NOIRE', 128, 142, '#f4f4fa', 'bold 19px monospace');
  ctx.restore();
  drawText('— Édition Complète —', 128, 166, '#9a9aae', '9px monospace');
  if (Math.floor(G.animT / 35) % 2 === 0)
    drawText('Appuie sur ENTRÉE', 128, 186, '#f8d048', 'bold 10px monospace');
  const sum = G.animT % 90 === 1 ? (titleSum = saveSummary()) : titleSum;
  if (sum) drawText('Partie en cours : ' + sum.zone + ' · ' + sum.badges + '/8 badges · équipe de ' + sum.team + ' (N.' + sum.lvl + ')', 128, 202, '#8a8a9e', '7px monospace');
  drawText('Flèches/ZQSD bouger · E parler · Entrée menu · M musique', 128, 214, '#50505c', '7px monospace');
  ctx.textAlign = 'left';
}

/* ============================================================
   MONDE — déplacements, interactions, menus du joueur
   ============================================================ */
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
let busy = false; // une séquence scriptée est en cours

function updateWorld() {
  if (G.moving) {
    G.moving.t += 0.14;
    if (G.moving.t >= 1) {
      G.px = G.moving.tx; G.py = G.moving.ty; G.moving = null;
      onStepEnd();
    }
    return;
  }
  if (busy || UI.dialog || UI.menu) { pressQueue.length = 0; return; }
  while (pressQueue.length) {
    const code = pressQueue.shift();
    if (code === 'Space' || code === 'KeyE') { interact(); return; }
    if (code === 'Enter' || code === 'Escape') { pauseMenu(); return; }
  }
  const d = heldDir();
  if (d) {
    G.dir = d;
    const [dx, dy] = DIRV[d];
    const nx = G.px + dx, ny = G.py + dy;
    if (!isBlocked(nx, ny)) G.moving = { tx: nx, ty: ny, t: 0 };
  }
}

let stepSaveTick = 0;
function onStepEnd() {
  const zn = zoneAt(G.px, G.py);
  if (zn !== G.zone) { G.zone = zn; toast(zn); }
  if (G.team.length && ++stepSaveTick % 4 === 0) saveGame();   // reprise possible à tout moment
  // objets au sol
  PICKUPS.forEach((p, i) => {
    if (!G.flags.pickups[i] && p.x === G.px && p.y === G.py) {
      G.flags.pickups[i] = true;
      SFX.confirm();
      if (p.item[0] === 'q') {
        G.flags[p.item] = true;
        const QNOMS = { qruban: 'le RUBAN DE SOIE de la fillette', qlentille: 'la LENTILLE DE CRISTAL du phare' };
        runScript(async () => { await say('Tu trouves ' + QNOMS[p.item] + ' !'); });
      } else {
        G.bag[p.item] += p.n;
        const NOMS = { caps: 'Capsule(s)', pot: 'Potion(s)', spot: 'Super Potion(s)', guer: 'Guérison(s)', bonbon: 'Bonbon(s) Rare(s)' };
        runScript(async () => { await say('Tu trouves ' + p.n + ' ' + NOMS[p.item] + ' !'); });
      }
      return;
    }
  });
  if (busy) return;
  // dresseurs embusqués et évènements
  if (!G.flags.rivalBeaten && G.px >= 17 && G.px <= 22 && G.py >= 29 && G.py <= 31) { rivalBattle(); return; }
  if (!G.flags.zoeBeaten && G.px >= 18 && G.px <= 21 && G.py >= 14 && G.py <= 16) { zoeBattle(); return; }
  if (!G.flags.ombreForet && G.px >= 98 && G.px <= 101 && G.py >= 32 && G.py <= 35) { runScript(ombreForetFight); return; }
  if (!G.flags.rival2 && G.px >= 238 && G.px <= 241 && G.py >= 33 && G.py <= 34) { runScript(rival2Fight); return; }
  if (!G.flags.ombreVolt && G.px >= 268 && G.px <= 273 && G.py >= 28 && G.py <= 30) { runScript(ombreVoltFight); return; }
  if (!G.flags.rival3 && G.px >= 450 && G.px <= 453 && G.py >= 33 && G.py <= 34) { runScript(rival3Fight); return; }
  // rencontres dans les hautes herbes
  if (tileAt(G.px, G.py) === ';' && chance(0.12) && G.team.some(m => m.hp > 0)) {
    const table = encounterTable(G.px, G.py);
    const total = table.reduce((s, e) => s + e[1], 0);
    let r = Math.random() * total, entry = table[0];
    for (const e of table) { r -= e[1]; if (r <= 0) { entry = e; break; } }
    const lvl = rndi(entry[2][0], entry[2][1]);
    runScript(async () => { await battle(makeMon(entry[0], lvl), null); });
  }
}

function runScript(fn) {
  busy = true;
  fn().catch(e => {
    console.error(e);
    // filet de sécurité : ne jamais rester coincé hors du monde
    B = null; UI.dialog = null; UI.menu = null;
    if (G.state !== 'title') { G.state = 'world'; setTrack('world'); }
  }).finally(() => { busy = false; });
}

function interact() {
  const [dx, dy] = DIRV[G.dir];
  const fx = G.px + dx, fy = G.py + dy;
  const n = npcAt(fx, fy);
  if (n) { npcTalk(n); return; }
  const sign = SIGNS[fx + ',' + fy];
  if (sign) { SFX.select(); runScript(async () => { await say(sign); }); return; }
  const b = buildingAt(fx, fy);
  if (b) {
    runScript(async () => {
      if (b.name === 'CLINIQUE') await say('CLINIQUE — L’infirmière devant l’entrée soigne ton équipe et gère la Boîte PC.');
      else if (b.name === 'LABO') await say('LABORATOIRE du Pr Karoubin — « Parti observer les créatures, parlez-moi dehors ! »');
      else if (b.name === 'BOUTIQUE') await say('BOUTIQUE — Le marchand devant l’entrée vend objets et Capsules.');
      else if (b.name === 'ARÈNE') await say('ARÈNE OFFICIELLE — Bats son champion (devant l’entrée) pour gagner le badge !');
      else if (b.name === 'CENTRALE') await say('CENTRALE DE VOLTCITÉ — « Accès réservé. Production : 100 %. »');
      else if (b.name === 'PANTHÉON') await say('PANTHÉON DE LA LIGUE — Les noms des Champions y sont gravés à jamais.');
      else await say('C’est verrouillé. Les habitants doivent dormir.');
    });
  }
}

function npcTalk(n) {
  if (n.dragon === 'auryon') { auryonBattle(); return; }
  if (n.dragon === 'mnemos') { mnemosBattle(); return; }
  if (n.dragon) { dragonBattle(); return; }
  // le PNJ se tourne vers le joueur
  n.dir = G.dir === 'up' ? 'down' : G.dir === 'down' ? 'up' : G.dir === 'left' ? 'right' : 'left';
  runScript(async () => {
    if (n.nurse || n.id === 'nurse') { await nurseTalk(n); return; }
    if (n.shop) { await shopMenu(); return; }
    if (n.captain) { await ferryMenu(n); return; }
    if (n.erebe) { await erebeTalk(); return; }
    if (n.quest) { await questTalk(n); return; }
    if (n.guard) {
      await say('GARDE : Halte ! Seuls les porteurs de ' + n.guard.need + ' badge(s) passent ici.');
      await say('GARDE : Il te manque le Badge ' + n.guard.badge + '. L’arène la plus proche est à l’ouest.');
      return;
    }
    if (n.champion) { await championFight(); return; }
    if (n.trainer) { await trainerFight(n); await questFollowUp(n); return; }
    if (n.id === 'prof') {
      if (G.flags.champion && G.flags.dragonDone && G.flags.auryonDone) {
        await say('PR KAROUBIN : Champion, les DEUX légendes à tes côtés... Tu es l’étoffe des Maîtres de région. Mon carnet est comblé !');
      } else if (G.flags.champion) {
        await say('PR KAROUBIN : CHAMPION ! Tout le bourg parle de toi !');
        await say('PR KAROUBIN : Mais écoute : le sceau du Lac Onyx se meurt, et un homme en noir rôde sur la rive. Zoé monte la garde — rejoins-la !');
        await say('PR KAROUBIN : ... Un homme en noir. Si c’est bien lui... Érèbe... alors fais très attention.');
      } else if (badgeCount() === 0) {
        await say('PR KAROUBIN : Huit arènes jalonnent la région, jusqu’à la Ligue tout à l’est. La première est à VILLEFLORE, passé la Route 1 !');
        await say('PR KAROUBIN : Les créatures évoluent avec les niveaux. Capture, entraîne, et reviens me voir en Champion !');
      } else {
        await say('PR KAROUBIN : ' + badgeCount() + ' badge(s) déjà ! La Ligue est au bout de la grande route, à l’est.');
        await say('PR KAROUBIN : Méfie-toi de l’ÉQUIPE OMBRE : ils cherchent à briser le sceau du Lac Onyx...');
      }
    } else if (n.id === 'villager') {
      await say('HABITANT : Feu > Plante > Eau > Feu... et le Sol stoppe l’Électrik ! Connaître les types, c’est gagner.');
      await say('HABITANT : Les boutiques vendent des Capsules, des Potions... et même des Bonbons Rares, paraît-il !');
    } else if (n.id === 'rival') {
      if (G.flags.rivalBeaten) await say('LÉO : Pff, je t’ai laissé gagner ! On se retrouve sur le GRAND PONT, à l’est !');
      else { await rivalFight(); }
    } else if (n.id === 'zoe') {
      await zoeTalk();
    }
  });
}

async function nurseTalk(n) {
  while (true) {
    const opts = ['SOIGNER', 'BOÎTE PC', 'RETOUR'];
    const ligue2Ready = n && n.id === 'nurse_ligue' && G.flags.champion;
    if (ligue2Ready) opts.splice(2, 0, 'LIGUE RONDE 2');
    const c = await menu(opts, { title: 'CLINIQUE' });
    if (ligue2Ready && c === 2) {
      if (G.flags.ligue2) { await say('INFIRMIÈRE : La Ronde 2 est en cours ! Les Maîtres t’attendent, plus forts que jamais (+16 niveaux).'); continue; }
      const s = await menu(['OUI, que la Ronde 2 commence !', 'Pas encore'], { title: 'Défier à nouveau la Ligue ?' });
      if (s === 0) {
        G.flags.ligue2 = true;
        for (const id of ['aeria', 'terros', 'glacia', 'ombrys']) delete G.flags['tr_' + id];
        SFX.catchOk(); saveGame();
        await say('INFIRMIÈRE : Les Maîtres reprennent leur poste, l’œil noir et l’équipe gonflée à bloc. Bonne chance, Champion !');
      }
      continue;
    }
    if (ligue2Ready && c === 3) break;
    if (c === 0) {
      await say('INFIRMIÈRE : Je m’occupe de ton équipe, un instant...');
      SFX.heal();
      G.team.forEach(m => { m.hp = m.maxhp; m.st = null; });
      await sleep(600);
      G.heal = { x: G.px, y: G.py };
      await say('Et voilà ! Toute ton équipe est en pleine forme.');
      if (G.bag.caps === 0) { G.bag.caps = 3; await say('Tiens, prends aussi 3 Capsules, tu n’en avais plus !'); }
      saveGame(); toast('Partie sauvegardée');
    } else if (c === 1) await pcMenu();
    else break;
  }
}

async function pcMenu() {
  while (true) {
    const c = await menu(['RETIRER (' + G.stored.length + ' en boîte)', 'DÉPOSER', 'RETOUR'], { title: 'BOÎTE PC' });
    if (c === 0) {
      if (!G.stored.length) { await say('La boîte est vide.'); continue; }
      if (G.team.length >= 6) { await say('Ton équipe est pleine ! Dépose d’abord quelqu’un.'); continue; }
      const labels = G.stored.map(m => monName(m) + ' N.' + m.level).concat(['ANNULER']);
      const i = await menu(labels, { x: 4, y: 4, title: 'Retirer qui ?' });
      if (i >= 0 && i < G.stored.length) {
        const m = G.stored.splice(i, 1)[0];
        G.team.push(m); SFX.confirm();
        await say(monName(m) + ' rejoint l’équipe !');
      }
    } else if (c === 1) {
      if (G.team.length <= 1) { await say('Tu dois garder au moins une créature !'); continue; }
      const labels = G.team.map(monLabel).concat(['ANNULER']);
      const i = await menu(labels, { x: 4, y: 4, title: 'Déposer qui ?' });
      if (i >= 0 && i < G.team.length) {
        const m = G.team.splice(i, 1)[0];
        G.stored.push(m); SFX.confirm();
        await say(monName(m) + ' est envoyé dans la boîte PC.');
      }
    } else break;
  }
}

async function checkTrueEnd() {
  if (G.flags.trueEnd) return;
  if (G.flags.champion && G.flags.dragonDone && G.flags.auryonDone && G.flags.mnemosDone) {
    G.flags.trueEnd = true;
    SFX.catchOk();
    await say('★ ★ ★   FIN VÉRITABLE   ★ ★ ★');
    await say('L’Oubli apaisé. La Mémoire gardée. La Lumière retrouvée. La région se souviendra de toi, pour toujours.');
    await say('Il reste des défis : la LIGUE RONDE 2 (infirmière de la Ligue), les 6 quêtes, et le CARNET des 100 créatures !');
    saveGame();
  }
}

async function ferryMenu(n) {
  await say('CAPITAINE : Le vent est bon ! Où met-on le cap ?');
  while (true) {
    const dests = FERRY.filter(f => f.id !== n.captain);
    const opts = dests.map(f => f.name).concat(['RESTER À QUAI']);
    const c = await menu(opts, { title: 'FERRY', x: 4, y: 4 });
    if (c < 0 || c >= dests.length) { await say('CAPITAINE : Comme tu voudras, moussaillon !'); return; }
    const d = dests[c];
    if (d.need && badgeCount() < d.need) { await say('CAPITAINE : Les courants y sont traîtres... Reviens avec ' + d.need + ' badges et on en reparle !'); continue; }
    if (d.flag && !G.flags[d.flag]) { await say('CAPITAINE : Le Sanctuaire ? Personne n’accoste là-bas : une brume noire le voile depuis mille ans...'); continue; }
    SFX.flee();
    await say('CAPITAINE : En route pour ' + d.name + ' ! Accroche-toi !');
    G.px = d.x; G.py = d.y; G.dir = 'down'; G.moving = null; G.zone = '';
    saveGame();
    return;
  }
}

function mnemosBattle() {

async function questTalk(n) {
  if (n.quest === 1) {
    if (G.flags.q1Done) { await say('FILLETTE : Mon ruban ! Je ne le perdrai plus jamais, promis-juré.'); return; }
    if (G.flags.qruban) {
      G.flags.q1Done = true; G.bag.spot += 3; SFX.catchOk();
      await say('FILLETTE : MON RUBAN ! Tu es mon héros ! Tiens, maman dit que ça soigne très fort. (+3 Super Potions)');
      saveGame(); return;
    }
    G.flags.q1 = true;
    await say('FILLETTE : Snif... Le vent a emporté mon beau ruban vers la FORÊT MURMURE. Tu me le retrouverais ?');
    return;
  }
  if (n.quest === 2) {
    if (G.flags.q2Done) { await say('ÉLEVEUR : Prends soin du petit. Son aïeul veillait sur les cols du Mont Givre, autrefois.'); return; }
    if (badgeCount() >= 4) {
      G.flags.q2Done = true;
      const m = makeMon('dracotin', 20); markCaught('dracotin');
      if (G.team.length < 6) { G.team.push(m); await say('ÉLEVEUR : Quatre badges... C’est toi que j’attendais. Ce petit DRACOTIN est à toi — élève-le mieux que moi.'); }
      else { G.stored.push(m); await say('ÉLEVEUR : C’est toi que j’attendais. Ton DRACOTIN t’attend dans la Boîte PC — élève-le bien.'); }
      SFX.catchOk(); saveGame(); return;
    }
    await say('ÉLEVEUR : J’ai un compagnon rare à confier... mais seulement à un dresseur portant 4 badges. Reviens-me voir.');
    return;
  }
  if (n.quest === 3) {
    if (G.flags.q3Done) { await say('GARDIEN : Le phare brille à nouveau jusqu’au Sanctuaire. Regarde-moi ce faisceau !'); return; }
    if (G.flags.qlentille) {
      G.flags.q3Done = true; G.bag.bonbon += 2; SFX.catchOk();
      await say('GARDIEN : Ma lentille ! Taillée dans le cristal de la Grotte Écho... Prends 2 Bonbons Rares de ma réserve, gamin.');
      saveGame(); return;

// carnet des créatures, paginé
async function dexMenu() {
  const ids = Object.keys(SPECIES);
  let page = 0;
  const PAGE = 10;
  while (true) {
    const slice = ids.slice(page * PAGE, (page + 1) * PAGE);
    const opts = slice.map((id, i) => {
      const num = String(page * PAGE + i + 1).padStart(2, '0');
      if (G.caught.includes(id)) return num + ' ' + SPECIES[id].name + ' ●';
      if (G.seen.includes(id)) return num + ' ' + SPECIES[id].name;
      return num + ' ???';
    });
    opts.push('PAGE SUIVANTE', 'RETOUR');
    const title = 'CARNET — vus ' + G.seen.length + ' · capturés ' + G.caught.length + ' / ' + ids.length;
    const c = await menu(opts, { x: 4, y: 4, title });
    if (c < 0 || c === opts.length - 1) break;
    if (c === opts.length - 2) { page = (page + 1) % Math.ceil(ids.length / PAGE); continue; }
    const id = slice[c];
    if (G.seen.includes(id)) {
      const sp = SPECIES[id];
      await say(sp.name + ' — [' + sp.types.join('/') + ']' +
        (G.caught.includes(id) ? '  (capturé)' : '  (aperçu)') +
        (sp.evolveAt ? '\nÉvolue au niveau ' + sp.evolveAt + '.' : ''));
    }
  }
}

async function useHealItem(m, kind) {
  if (kind === 'pot' || kind === 'spot') {
    const amount = kind === 'pot' ? 25 : 60;
    if (m.hp <= 0) { await say('K.O. ! Seule la clinique peut le ranimer.'); return false; }
    if (m.hp >= m.maxhp) { await say(monName(m) + ' a déjà tous ses PV.'); return false; }
    G.bag[kind]--; m.hp = Math.min(m.maxhp, m.hp + amount); SFX.heal();
    await say(monName(m) + ' récupère ' + amount + ' PV !');
    return true;
  }
  if (kind === 'guer') {
    if (!m.st) { await say(monName(m) + ' n’a aucun problème de statut.'); return false; }
    G.bag.guer--; SFX.heal();
    await say(monName(m) + ' est guéri de son ' + (m.st === 'psn' ? 'empoisonnement' : m.st === 'brn' ? 'sa brûlure' : 'sa paralysie') + ' !');

    return true;
  }
  if (kind === 'bonbon') {
    if (m.level >= LEVEL_CAP) { await say(monName(m) + ' est déjà au niveau maximum.'); return false; }
    G.bag.bonbon--; m.xp = xpTotalFor(m.level + 1);
    await levelUpOnce(m);

  }
  return false;
}

/* ============================================================
   COMBAT — moteur au tour par tour
   ============================================================ */
let B = null;
function bAlly() { return G.team[B.allyIdx]; }
function setPrompt(t) { UI.dialog = { text: t, shown: t.length, more: false }; }

const ST_IMMUNE = { brn: 'Feu', par: 'Électrik', psn: 'Plante' };
async function execMove(att, def, mvId, attIsAlly) {
  const mv = MOVES[mvId];
  if (att.st === 'par' && chance(0.25)) {
    await say(monName(att) + ' est paralysé ! Il ne peut pas attaquer !');
    return false;
  }
  await say(monName(att) + ' utilise ' + mv.name + ' !');
  if (attIsAlly) B.offAlly = 7; else B.offFoe = 7;
  await sleep(130);
  B.offAlly = 0; B.offFoe = 0;
  if (rndi(1, 100) > mv.acc) { await say('... mais rate sa cible !'); return false; }
  const tm = typeMult(mv.type, SPECIES[def.sp].types);
  if (tm === 0) { await say('Ça n’affecte pas ' + monName(def) + '...'); return false; }
  const crit = chance(1 / 16);
  const stab = SPECIES[att.sp].types.includes(mv.type) ? 1.5 : 1;
  const atkEff = att.atk * (att.st === 'brn' ? 0.5 : 1);
  let dmg = (((2 * att.level / 5 + 2) * mv.pow * atkEff / Math.max(1, def.def)) / 50 + 2);
  dmg = Math.max(1, Math.floor(dmg * stab * tm * (crit ? 1.5 : 1) * (0.85 + Math.random() * 0.15)));
  SFX.hit();
  if (attIsAlly) B.flashFoe = 10; else B.flashAlly = 10;
  B.shake = crit ? 12 : 7;
  spawnHitParts(attIsAlly, TYPE_COLORS[mv.type] || '#fff', crit);
  await animHP(def, Math.max(0, def.hp - dmg));
  if (crit) await say('Coup critique !');
  if (tm >= 2) await say('C’est super efficace !');
  else if (tm < 1) await say('Ce n’est pas très efficace...');
  if (mv.drain && dmg > 0 && att.hp > 0) {
    const heal = Math.max(1, Math.floor(dmg / 2));
    await animHP(att, Math.min(att.maxhp, att.hp + heal));
    await say(monName(att) + ' draine de l’énergie !');
  }
  if (mv.st && def.hp > 0 && !def.st && chance(mv.st.p)
      && !SPECIES[def.sp].types.includes(ST_IMMUNE[mv.st.k])) {
    def.st = mv.st.k;
    const lib = { psn: 'est empoisonné !', brn: 'est brûlé !', par: 'est paralysé !' };
    await say(monName(def) + ' ' + lib[def.st]);
  }
  return def.hp <= 0;
}

// dégâts de fin de tour (poison, brûlure) ; renvoie un résultat de combat ou null
async function endTurnTicks() {
  for (const [m, isAlly] of [[bAlly(), true], [B.foe, false]]) {
    if (m.hp <= 0 || (m.st !== 'psn' && m.st !== 'brn')) continue;
    const dmg = Math.max(1, Math.floor(m.maxhp / 12));
    await say(monName(m) + (m.st === 'psn' ? ' souffre du poison !' : ' souffre de sa brûlure !'));
    SFX.faible();
    await animHP(m, Math.max(0, m.hp - dmg));
    if (m.hp <= 0) return await handleFaint(m, isAlly);
  }
  return null;
}

async function animHP(m, target) {
  while (m.hp !== target) {
    m.hp += Math.sign(target - m.hp) * Math.min(2, Math.abs(target - m.hp));
    await nextFrame();
  }
  await sleep(120);
}

const LEVEL_CAP = 60;
async function levelUpOnce(mon) {
  mon.level++;
  const oldMax = mon.maxhp;
  recalcStats(mon);
  mon.hp = Math.min(mon.maxhp, mon.hp + (mon.maxhp - oldMax));
  SFX.levelup();
  await say(monName(mon) + ' passe au niveau ' + mon.level + ' !');
  for (const [lv, mv] of SPECIES[mon.sp].learn) {
    if (lv === mon.level && !mon.moves.includes(mv)) {
      if (mon.moves.length < 4) { mon.moves.push(mv); await say(monName(mon) + ' apprend ' + MOVES[mv].name + ' !'); }
      else {
        const old = mon.moves.shift(); mon.moves.push(mv);
        await say(monName(mon) + ' oublie ' + MOVES[old].name + ' et apprend ' + MOVES[mv].name + ' !');
      }
    }
  }
  const sp = SPECIES[mon.sp];
  if (sp.evolveAt && mon.level >= sp.evolveAt) {
    await say('Quoi ?! ' + monName(mon) + ' frémit d’une lueur étrange...');
    if (B) for (let i = 0; i < 8; i++) { B.flashAlly = 3; await sleep(90); }
    const oldName = monName(mon);
    mon.sp = sp.evolveTo;
    markCaught(mon.sp);
    const om = mon.maxhp;
    recalcStats(mon);
    mon.hp = Math.min(mon.maxhp, mon.hp + (mon.maxhp - om));
    SFX.catchOk();
    await say('Félicitations ! ' + oldName + ' évolue en ' + monName(mon) + ' !');
  }
}
async function gainXP(mon, foe) {
  const amt = Math.max(1, Math.floor(SPECIES[foe.sp].exp * foe.level / 7 * (B.trainer ? 2 : 1)));
  await say(monName(mon) + ' gagne ' + amt + ' points d’XP !');
  mon.xp += amt;
  while (mon.level < LEVEL_CAP && mon.xp >= xpTotalFor(mon.level + 1)) await levelUpOnce(mon);
}

async function handleFaint(mon, isAllySide) {
  SFX.faint();
  if (!isAllySide) {
    B.foeDown = true;
    await sleep(350);
    await say(monName(mon) + ' ennemi est K.O. !');
    await gainXP(bAlly(), mon);
    if (B.trainer && B.foeIdx < B.foes.length - 1) {
      B.foeIdx++; B.foe = B.foes[B.foeIdx]; B.foeDown = false;
      await say(B.trainer.name + ' envoie ' + monName(B.foe) + ' !');
      return null;
    }
    return 'win';
  }
  await say(monName(mon) + ' est K.O. !');
  if (!G.team.some(m => m.hp > 0)) return 'lose';
  let t = -1;
  while (t < 0 || G.team[t].hp <= 0) {
    setPrompt('Qui envoyer au combat ?');
    t = await teamMenu(true);
  }
  B.allyIdx = t;
  await say('À toi, ' + monName(bAlly()) + ' !');
  return null;
}

async function bothMoves(allyMv) {
  const a = bAlly(), f = B.foe;
  const fMv = pick(f.moves);
  const ap = MOVES[allyMv].prio || 0, fp = MOVES[fMv].prio || 0;
  const aSpe = a.spe * (a.st === 'par' ? 0.5 : 1), fSpe = f.spe * (f.st === 'par' ? 0.5 : 1);
  const allyFirst = ap !== fp ? ap > fp : (aSpe === fSpe ? chance(0.5) : aSpe > fSpe);
  const seq = allyFirst
    ? [[a, f, allyMv, true], [f, a, fMv, false]]
    : [[f, a, fMv, false], [a, f, allyMv, true]];
  for (const [att, def, mv, isAllyAtt] of seq) {
    if (att.hp <= 0) continue;
    const ko = await execMove(att, def, mv, isAllyAtt);
    if (ko) return await handleFaint(def, !isAllyAtt);
  }
  return null;
}

async function foeFreeAttack() {
  const f = B.foe;
  if (f.hp <= 0) return null;
  const ko = await execMove(f, bAlly(), pick(f.moves), false);
  if (ko) return await handleFaint(bAlly(), true);
  return null;
}

/* ---- capture ---- */
async function tryCapture() {
  if (B.trainer) { await say('On ne capture pas la créature d’un autre dresseur !'); return 'noturn'; }
  if (G.bag.caps <= 0) { await say('Tu n’as plus de Capsules !'); return 'noturn'; }
  G.bag.caps--;
  await say('Tu lances une Capsule !');
  SFX.throwB();
  B.ball = { t: 0, shake: 0 };
  for (let i = 0; i <= 24; i++) { B.ball.t = i / 24; await nextFrame(); await nextFrame(); }
  B.hideFoe = true;
  const f = B.foe;
  const a = (3 * f.maxhp - 2 * f.hp) / (3 * f.maxhp) * SPECIES[f.sp].catch / 255;
  const pShake = Math.pow(Math.min(0.95, a * 1.8), 1 / 3);
  let ok = true;
  for (let s = 0; s < 3; s++) {
    await sleep(430);
    SFX.tick();
    B.ball.shake = (s % 2 ? 1 : -1) * 2;
    await sleep(170);
    B.ball.shake = 0;
    if (!chance(pShake)) { ok = false; break; }
  }
  await sleep(380);
  if (!ok) {
    B.hideFoe = false; B.ball = null;
    await say('Oh non ! ' + monName(f) + ' s’est libéré !');
    return 'failed';
  }
  SFX.catchOk();
  await say('Et hop ! ' + monName(f) + ' a été capturé !');
  markCaught(f.sp);
  if (B.legendary) {
    if (B.auryon) G.flags.auryonDone = true;
    else if (B.mnemos) G.flags.mnemosDone = true;
    else G.flags.dragonDone = true;
  }
  if (G.team.length < 6) { G.team.push(f); await say(monName(f) + ' rejoint ton équipe !'); }
  else { G.stored.push(f); await say('Ton équipe est pleine : ' + monName(f) + ' est envoyé au labo du Pr Karoubin.'); }
  saveGame();
  return 'caught';
}

/* ---- choix d'action du joueur ---- */
async function chooseAction() {
  while (true) {
    setPrompt('Que doit faire\n' + monName(bAlly()) + ' ?');
    const c = await menu(['ATTAQUE', 'SAC', 'ÉQUIPE', 'FUITE'],
      { cols: 2, x: 124, y: SCR_H - 52, w: 128, cancelable: false });
    if (c === 0) {
      const mvs = bAlly().moves.map(id => MOVES[id].name + ' [' + MOVES[id].type + ']');
      const mc = await menu(mvs, { x: 4, y: SCR_H - 52 - mvs.length * 13 - 14, title: 'ATTAQUES' });
      if (mc >= 0) return { kind: 'move', mv: bAlly().moves[mc] };
    } else if (c === 1) {
      const bc = await menu(
        ['Capsule x' + G.bag.caps, 'Potion x' + G.bag.pot, 'Super Pot. x' + G.bag.spot, 'Guérison x' + G.bag.guer, 'RETOUR'],
        { x: 4, y: SCR_H - 52 - 5 * 13 - 14, title: 'SAC' });
      if (bc === 0) return { kind: 'caps' };
      if (bc === 1) return { kind: 'pot' };
      if (bc === 2) return { kind: 'spot' };
      if (bc === 3) return { kind: 'guer' };
    } else if (c === 2) {
      const t = await teamMenu(true);
      if (t >= 0) {
        if (t === B.allyIdx) { await say('Il est déjà au combat !'); continue; }
        if (G.team[t].hp <= 0) { await say(monName(G.team[t]) + ' est K.O. !'); continue; }
        return { kind: 'switch', idx: t };
      }
    } else if (c === 3) return { kind: 'flee' };
  }
}

/* ---- combat principal ---- */
async function battle(wild, trainer, opts) {
  opts = opts || {};
  setTrack('battle');
  G.state = 'battle';
  B = {
    trainer, foes: trainer ? trainer.team.slice() : [wild],
    foeIdx: 0, foe: null,
    allyIdx: Math.max(0, G.team.findIndex(m => m.hp > 0)),
    intro: 26, ball: null, hideFoe: false, foeDown: false,
    offFoe: 0, offAlly: 0, flashFoe: 0, flashAlly: 0,
    legendary: !!opts.legendary, auryon: !!opts.auryon, mnemos: !!opts.mnemos,
    theme: themeAt(G.px), slide: 26, shake: 0, parts: [],
  };
  B.foe = B.foes[0];
  B.foes.forEach(f => markSeen(f.sp));
  if (trainer) { await say(trainer.name + ' veut se battre !'); await say(trainer.name + ' envoie ' + monName(B.foe) + ' !'); }
  else if (B.legendary) await say(B.mnemos ? 'MNÉMOS, la Mémoire du monde, jauge ton âme !' : B.auryon ? 'AURYON, la lumière du Mont Givre, fond sur toi !' : 'NOCTYRAN, l’ombre du Lac Onyx, fond sur toi !');
  else await say('Un ' + monName(B.foe) + ' sauvage apparaît !');
  await say('À toi, ' + monName(bAlly()) + ' !');

  let result = null;
  while (!result) {
    const act = await chooseAction();
    UI.dialog = null;
    let acted = false;
    if (act.kind === 'move') { result = await bothMoves(act.mv); acted = true; }
    else if (act.kind === 'switch') {
      B.allyIdx = act.idx;
      await say('À toi, ' + monName(bAlly()) + ' !');
      result = await foeFreeAttack();
    } else if (act.kind === 'pot' || act.kind === 'spot' || act.kind === 'guer') {
      if (G.bag[act.kind] <= 0) { await say('Tu n’en as plus !'); acted = false; continue; }
      const m = bAlly();
      if (act.kind === 'guer') {
        if (!m.st) { await say(monName(m) + ' n’a aucun problème de statut.'); acted = false; continue; }
        G.bag.guer--; m.st = null; SFX.heal();
        await say(monName(m) + ' est guéri !');
      } else {
        if (m.hp >= m.maxhp) { await say('Ses PV sont déjà au maximum !'); acted = false; continue; }
        G.bag[act.kind]--; SFX.heal();
        await animHP(m, Math.min(m.maxhp, m.hp + (act.kind === 'pot' ? 25 : 60)));
        await say(monName(m) + ' récupère des PV !');
      }
      result = await foeFreeAttack();
    } else if (act.kind === 'caps') {
      const r = await tryCapture();
      if (r === 'caught') result = 'caught';
      else if (r === 'failed') result = await foeFreeAttack();
    } else if (act.kind === 'flee') {
      if (trainer) { await say('Impossible de fuir un duel de dresseurs !'); continue; }
      const a = bAlly(), f = B.foe;
      if (chance(a.spe >= f.spe ? 0.9 : 0.4 + 0.4 * a.spe / f.spe)) {
        SFX.flee(); await say('Tu prends la fuite !'); result = 'flee';
      } else {
        await say('Impossible de fuir !');
        result = await foeFreeAttack();
        acted = true;
      }
    }
    if (act.kind === 'switch' || act.kind === 'pot' || act.kind === 'spot' || act.kind === 'guer' || act.kind === 'caps') acted = true;
    if (!result && acted && G.state === 'battle') result = await endTurnTicks();
  }

  if (result === 'win' && trainer) {
    await say(trainer.winMsg);
    if (trainer.prize) { G.money += trainer.prize; SFX.confirm(); await say('Tu remportes ' + trainer.prize + ' ₽ !'); }
  }
  if (result === 'win' && B.legendary) await say(B.mnemos ? 'Les glyphes pâlissent... « REVIENS QUAND TU SERAS PRÊT À TE SOUVENIR. »' : B.auryon ? 'La lumière se dissout en flocons dorés... Elle reviendra planer sur le sommet.' : 'L’ombre se disperse en volutes noires... Tu sens qu’elle reviendra hanter la rive.');
  if (result === 'lose') {
    if (trainer) await say(trainer.loseMsg);
    await say('Tu n’as plus de créatures en état de se battre...');
    await say('Tout devient noir. Tu te réveilles à la clinique du bourg.');
    G.team.forEach(m => { m.hp = m.maxhp; m.st = null; });
    G.px = G.heal.x; G.py = G.heal.y; G.dir = 'down'; G.moving = null;
  }
  const caughtLegendary = result === 'caught' && B.legendary;
  const caughtAuryon = caughtLegendary && B.auryon;
  const caughtMnemos = caughtLegendary && B.mnemos;
  B = null;
  G.state = 'world';
  setTrack('world');
  saveGame();
  if (caughtLegendary) {
    if (caughtMnemos) {
      await say('MNÉMOS s’incline : « JE TE CONFIE LA MÉMOIRE DU MONDE. QU’ELLE NE S’ÉTEIGNE JAMAIS. »');
      await checkTrueEnd();
    } else if (caughtAuryon) {
      await say('Éblouissant... AURYON, la Mémoire ailée, est avec toi !');
      await checkTrueEnd();
    } else {
      await say('L’Oubli s’apaise entre tes mains... NOCTYRAN est avec toi !');
      await say('Érèbe murmure : « Le Sanctuaire... va au Sanctuaire. MNÉMOS doit savoir. » Le ferry t’y mènera.');
    }
  }
  return result === 'win' || result === 'caught';
}

function fillEllipse(x, y, rx, ry, color) {
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}
function spawnHitParts(onFoe, color, big) {
  const cx = onFoe ? 184 : 58, cy = onFoe ? 54 : 132;
  for (let i = 0; i < (big ? 16 : 10); i++) {
    B.parts.push({ x: cx + rndi(-8, 8), y: cy + rndi(-8, 8),
      vx: (Math.random() - 0.5) * 3.2, vy: -Math.random() * 2.6 - 0.4,
      life: rndi(12, 24), color });
  }
}
const BATTLE_SKIES = new Map();
function battleSky(th) {
  if (th === THEMES.cave)    return ['#2a2420', '#4a4038', '#5e5448'];
  if (th === THEMES.dark)    return ['#171226', '#322a4e', '#3e3856'];
  if (th === THEMES.volcano) return ['#2a1210', '#5e2a1e', '#4e362e'];
  if (th === THEMES.snow)    return ['#8fb4d8', '#cfe2f2', '#a8c4d8'];
  if (th === THEMES.sand)    return ['#88b0d8', '#e8d8a8', '#b09a58'];
  if (th === THEMES.gold)    return ['#88a8c8', '#d8cf96', '#9a8e3a'];
  if (th === THEMES.forest)  return ['#3a5e4a', '#6cae5e', '#3a7e36'];
  return ['#78aadc', '#a8d49a', '#4f9a44'];
}
function drawBattle() {
  if (!B) { ctx.fillStyle = '#10101a'; ctx.fillRect(0, 0, SCR_W, SCR_H); return; }
  ctx.save();
  if (B.shake > 0) { B.shake--; ctx.translate(rndi(-2, 2), rndi(-2, 2)); }
  const [skyA, skyB, ground] = battleSky(B.theme || THEMES.grass);
  const grd = ctx.createLinearGradient(0, 0, 0, 110);
  grd.addColorStop(0, skyA); grd.addColorStop(1, skyB);
  ctx.fillStyle = grd; ctx.fillRect(-3, -3, SCR_W + 6, 116);
  // silhouettes du décor à l'horizon
  ctx.fillStyle = 'rgba(20,20,40,0.25)';
  const sil = B.theme === THEMES.dark ? 'pillar' : (B.theme && B.theme.solid) || 'tree';
  for (let i = 0; i < 7; i++) {
    const bx = 10 + i * 38, by = 96;
    if (sil === 'rock') { ctx.beginPath(); ctx.ellipse(bx, by + 4, 16, 9, 0, Math.PI, 0); ctx.fill(); }
    else if (sil === 'pillar') ctx.fillRect(bx - 3, by - 18, 7, 24);
    else { ctx.beginPath(); ctx.ellipse(bx, by - 6, 9, 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(bx - 1, by, 3, 8); }
  }
  // sol
  ctx.fillStyle = ground; ctx.fillRect(-3, 108, SCR_W + 6, SCR_H - 105);
  ctx.fillStyle = shade(ground, 0.85); ctx.fillRect(-3, 108, SCR_W + 6, 4);
  ctx.fillStyle = shade(ground, 0.9);
  for (let i = 0; i < 9; i++) ctx.fillRect(8 + i * 30, 130 + (i % 3) * 18, 12, 2);
  // plateformes
  const pf = (x, y, rx, ry) => {
    ctx.fillStyle = shade(ground, 0.7);
    ctx.beginPath(); ctx.ellipse(x, y + 2, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shade(ground, 1.18);
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = shade(ground, 1.05);
    ctx.beginPath(); ctx.ellipse(x, y + 1, rx - 6, ry - 2, 0, 0, Math.PI * 2); ctx.fill();
  };
  pf(184, 90, 50, 12);
  pf(58, 166, 54, 13);

  const foe = B.foe, al = bAlly();
  if (B.slide > 0) B.slide--;
  const slideF = B.slide * 5, slideA = -B.slide * 5;
  // adversaire
  if (B.flashFoe > 0) B.flashFoe--;
  if (!B.hideFoe && !(B.flashFoe % 2)) {
    if (B.foeDown) ctx.globalAlpha = 0.45;
    const fy = 24 + (B.foeDown ? 26 : 0);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(184 + slideF, 88, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
    drawSprite(ctx, SPR[foe.sp].mat, SPR[foe.sp].pal, 152 - B.offFoe * 2 + slideF, fy, 4, false);
    ctx.globalAlpha = 1;
  }
  // allié (vu de dos : miroir)
  if (B.flashAlly > 0) B.flashAlly--;
  if (!(B.flashAlly % 2)) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(58 + slideA, 164, 30, 7, 0, 0, Math.PI * 2); ctx.fill();
    drawSprite(ctx, SPR[al.sp].mat, SPR[al.sp].pal, 26 + B.offAlly * 2 + slideA, 100, 4, true);
  }
  // particules d'impact
  for (let i = B.parts.length - 1; i >= 0; i--) {
    const p = B.parts[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
    if (p.life <= 0) { B.parts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life / 10);
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), p.life > 14 ? 3 : 2, p.life > 14 ? 3 : 2);
    ctx.globalAlpha = 1;
  }
  // capsule lancée
  if (B.ball) {
    const t = B.ball.t;
    const bx = 64 + (184 - 64) * t + (B.ball.shake || 0);
    const by = (148 + (76 - 148) * t) - Math.sin(Math.PI * t) * 46;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(184, 88, 7, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a22'; ctx.fillRect(bx - 5, by - 5, 10, 10);
    ctx.fillStyle = '#e83a4a'; ctx.fillRect(bx - 4, by - 4, 8, 4);
    ctx.fillStyle = '#f4f4f8'; ctx.fillRect(bx - 4, by, 8, 4);
    ctx.fillStyle = '#fff'; ctx.fillRect(bx - 1, by - 1, 2, 2);
  }
  // panneau adversaire
  drawBox(6, 8, 118, 36);
  drawText(monName(foe), 14, 14, '#fff');
  drawText('N.' + foe.level, 94, 14, '#c8c8d0');
  ctx.fillStyle = TYPE_COLORS[SPECIES[foe.sp].types[0]] || '#888';
  ctx.fillRect(14, 24, 30, 2);
  drawHPBar(14, 30, 98, foe.hp / foe.maxhp);
  if (foe.st) drawText(ST_NAMES[foe.st], 96, 22, ST_COLORS[foe.st], 'bold 7px monospace');
  // panneau allié
  drawBox(134, 110, 118, 54);
  drawText(monName(al), 142, 116, '#fff');
  drawText('N.' + al.level, 222, 116, '#c8c8d0');
  ctx.fillStyle = TYPE_COLORS[SPECIES[al.sp].types[0]] || '#888';
  ctx.fillRect(142, 126, 30, 2);
  drawHPBar(142, 131, 98, al.hp / al.maxhp);
  drawText(al.hp + '/' + al.maxhp + ' PV', 142, 138, '#c8c8d0', '8px monospace');
  if (al.st) drawText(ST_NAMES[al.st], 214, 138, ST_COLORS[al.st], 'bold 7px monospace');
  const xpCur = al.xp - xpTotalFor(al.level);
  const xpNeed = xpTotalFor(al.level + 1) - xpTotalFor(al.level);
  ctx.fillStyle = '#23232e'; ctx.fillRect(142, 152, 98, 4);
  ctx.fillStyle = '#48a8f8'; ctx.fillRect(142, 152, Math.round(98 * clamp(xpCur / xpNeed, 0, 1)), 4);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(142, 152, Math.round(98 * clamp(xpCur / xpNeed, 0, 1)), 1);
  // cadre de message permanent
  drawBox(4, SCR_H - 52, SCR_W - 8, 48);
  ctx.restore();
  // fondu d'introduction
  if (B.intro > 0) {
    B.intro--;
    ctx.fillStyle = 'rgba(0,0,0,' + (B.intro / 26) + ')';
    ctx.fillRect(0, 0, SCR_W, SCR_H);
  }
}

async function titleFlow() {
  G.state = 'title'; setTrack('title');
  while ((await waitKey()) !== 'ok') { /* attendre Entrée */ }
  SFX.confirm();
  while (true) {
    if (hasSave()) {
      const c = await menu(['CONTINUER', 'NOUVELLE PARTIE', 'CODE SECRET'], { x: 80, y: 110, cancelable: false });
      if (c === 0) {
        if (loadGame()) { startWorld(); return; }
        try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
        continue;
      }
      if (c === 2) { if (await codePrompt()) { startWorld(); return; } continue; }
      const s = await menu(['NON, garder ma partie', 'OUI, tout effacer'], { title: 'Effacer la sauvegarde ?', x: 44, y: 110, cancelable: false });
      if (s === 1) { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} memSave = null; await newGame(); return; }
    } else {
      const c = await menu(['NOUVELLE PARTIE', 'CODE SECRET'], { x: 80, y: 116, cancelable: false });
      if (c === 1) { if (await codePrompt()) { startWorld(); return; } continue; }
      await newGame(); return;
    }
  }
}
async function codePrompt() {
  const code = window.prompt ? window.prompt('Colle ton CODE SECRET de sauvegarde :', '') : null;
  if (code && importCode(code)) { toast('Partie restaurée !'); return true; }
  if (code !== null) await say('Ce code est invalide ou incomplet...');
  return false;
}

async function newGame() {
  Object.assign(G, { px: 25, py: 53, dir: 'down', moving: null, team: [],
    bag: { caps: 5, pot: 3, spot: 0, guer: 0, bonbon: 0 }, money: 600,
    seen: [], caught: [], heal: { x: 9, y: 53 },
    flags: { pickups: {} }, stored: [], zone: '' });
  G.state = 'world'; setTrack('world');
  await sleep(400);
  await say('— Il y a mille ans, deux dragons jumeaux veillaient sur la région : AURYON, la Mémoire... et NOCTYRAN, l’Oubli. —');
  await say('— Quand les hommes voulurent s’emparer de la Mémoire, l’Oubli engloutit leur cité sous un lac noir. —');
  await say('— Huit sages forgèrent huit BADGES, les clés du sceau qui endormit l’Oubli. Puis, comme toujours... on oublia. —');
  await say('PR KAROUBIN : Bienvenue dans le monde de VERSION NOIRE !');
  await say('PR KAROUBIN : Des créatures fabuleuses peuplent cette région — 39 espèces recensées dans mon carnet !');
  await say('PR KAROUBIN : Huit ARÈNES jalonnent la grande route de l’est, jusqu’à la LIGUE et son Champion.');
  await say('PR KAROUBIN : Pour commencer ton voyage, choisis ta première partenaire !');
  const sp = await chooseStarter();
  G.state = 'world';
  G.team = [makeMon(sp, 5)];
  G.flags.starter = sp;
  markCaught(sp);
  SFX.catchOk();
  await say(SPECIES[sp].name + ' (niveau 5) rejoint ton équipe !');
  await say('PR KAROUBIN : Excellent choix ! 5 Capsules, 3 Potions et 600 ₽ : te voilà paré.');
  await say('PR KAROUBIN : La ROUTE 1 est au nord, puis VILLEFLORE et sa première arène à l’EST. LÉO t’attend déjà... Bonne aventure !');
  saveGame();
  startWorld();
}

function startWorld() {
  G.state = 'world'; setTrack('world');
  G.zone = zoneAt(G.px, G.py);
  toast(G.zone);
}

/* ============================================================
   VALIDATION DES DONNÉES, BOUCLE PRINCIPALE, DÉMARRAGE
   ============================================================ */
function validateData() {
  const errs = [];
  for (const [id, s] of Object.entries(SPECIES)) {
    if (!SPR[id]) errs.push('sprite manquant : ' + id);
    for (const [, mv] of s.learn) if (!MOVES[mv]) errs.push('attaque inconnue ' + mv + ' (' + id + ')');
    if (s.evolveTo && !SPECIES[s.evolveTo]) errs.push('évolution inconnue : ' + s.evolveTo);
    for (const t of s.types) if (!TYPE_COLORS[t]) errs.push('type inconnu ' + t + ' (' + id + ')');
  }
  for (const [name, s] of Object.entries(SPR)) {
    if (s.mat.length !== 16) errs.push(name + ' : ' + s.mat.length + ' lignes');
    s.mat.forEach((r, i) => { if (r.length !== 16) errs.push(name + ' ligne ' + i + ' : ' + r.length + ' px'); });
    const unk = new Set();
    for (const r of s.mat) for (const ch of r) if (ch !== '.' && !s.pal[ch]) unk.add(ch);
    if (unk.size) errs.push(name + ' : pixels sans couleur [' + [...unk].join(' ') + ']');
  }
  for (const mv of Object.values(MOVES)) if (!TYPE_COLORS[mv.type]) errs.push('type inconnu : ' + mv.type);
  M.forEach((row, j) => { if (row.length !== MAP_W) errs.push('carte ligne ' + j); });
  for (const n of NPCS) { const t = tileAt(n.x, n.y); if (t === '#' || t === '~') errs.push('PNJ mal placé : ' + n.id); }
  for (const p of PICKUPS) { const t = tileAt(p.x, p.y); if (t === '#' || t === '~' || t === '=') errs.push('objet mal placé : ' + p.x + ',' + p.y); }
  for (const key of Object.keys(SIGNS)) {
    const [x, y] = key.split(',').map(Number);
    if (tileAt(x, y) !== 'S') errs.push('panneau sans tuile S : ' + key);
  }
  for (const z of ZONES) if (z.table)
    for (const [sp] of z.table) if (!SPECIES[sp]) errs.push('rencontre inconnue : ' + sp);
  // atteignabilité : BFS depuis le départ en ignorant les PNJ (gardes inclus)
  const open = new Set();
  const blockedTile = t => t === '#' || t === '~' || t === '=' || t === 'S' || t === 'l';
  const q = [[25, 53]];
  open.add('25,53');
  for (const f of FERRY) { q.push([f.x, f.y]); open.add(f.x + ',' + f.y); }
  while (q.length) {
    const [x, y] = q.pop();
    for (const [dx, dy] of [[0,1],[0,-1],[1,0],[-1,0]]) {
      const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
      if (open.has(k) || nx < 0 || ny < 0 || nx >= MAP_W || ny >= MAP_H) continue;
      if (blockedTile(tileAt(nx, ny)) || buildingAt(nx, ny)) continue;
      open.add(k); q.push([nx, ny]);
    }
  }
  const mustReach = [];
  for (const n of NPCS) mustReach.push([n.id, n.x, n.y]);
  for (const p of PICKUPS) mustReach.push(['objet', p.x, p.y]);
  for (const [id, x, y] of mustReach) {
    const ok = open.has(x + ',' + y) ||
      [[0,1],[0,-1],[1,0],[-1,0]].some(([dx,dy]) => open.has((x+dx) + ',' + (y+dy)));
    if (!ok) errs.push('inatteignable : ' + id + ' en (' + x + ',' + y + ')');
  }
  for (const b of BUILDINGS) {
    if (!open.has(b.door + ',' + (b.y + b.h))) errs.push('porte inatteignable : ' + (b.name || 'maison') + ' (' + b.door + ',' + (b.y + b.h) + ')');
  }
  for (const tbl of [encounterTable(5, 5), encounterTable(5, 30)])
    for (const [sp] of tbl) if (!SPECIES[sp]) errs.push('rencontre inconnue : ' + sp);
  return errs;
}

function frame() {
  G.animT++;
  if (G.state === 'world') { updateWorld(); drawWorld(); }
  else if (G.state === 'battle') drawBattle();
  else if (G.state === 'starter') drawStarter();
  else drawTitle();
  drawDialogUI();
  drawMenuUI();
  drawToastUI();
  requestAnimationFrame(frame);
}

function boot() {
  cv = document.getElementById('screen');
  ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('keyup', onKeyUp);
  const errs = validateData();
  if (errs.length) console.warn('Données du jeu :', errs);
  runScript(titleFlow);
  requestAnimationFrame(frame);
}

if (typeof window !== 'undefined') {
  if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot);
  else boot();
} else {
  // auto-test sous Node
  const errs = validateData();
  const a = makeMon('pyrouf', 5);
  if (a.hp <= 0 || !a.moves.length) errs.push('makeMon cassé');
  if (typeMult('Eau', ['Feu']) !== 2) errs.push('table des types cassée');
  if (typeMult('Électrik', ['Sol']) !== 0) errs.push('immunité Sol cassée');
  if (xpTotalFor(5) !== 125) errs.push('courbe XP cassée');
  if (isBlocked(25, 53)) errs.push('case de départ bloquée !');
  if (isBlocked(19, 45) || isBlocked(19, 17)) errs.push('passage entre zones bloqué !');
  console.log(errs.length ? 'ERREURS :\n' + errs.join('\n') : 'AUTO-TEST OK');
  if (errs.length) process.exit(1);
}

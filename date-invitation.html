<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Petite question…</title>
<style>
  :root {
    --accent: #ef6b4d;        /* corail discret */
    --accent-fonce: #d8542f;
    --fond: #f4f1ec;          /* crème sobre */
    --carte: #ffffff;
    --texte: #2c2926;
    --gris: #8a857e;
    --bord: #e7e2da;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* Empêche Safari iOS de sélectionner le texte / d'afficher la loupe au clic */
  html, body, h1, p, button, label, .carte, .recap {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  /* …mais on garde la saisie possible dans les champs */
  input, textarea {
    -webkit-user-select: text;
    -moz-user-select: text;
    -ms-user-select: text;
    user-select: text;
  }

  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--texte);
    background: var(--fond);
    overflow-x: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
  }

  .carte {
    position: relative;
    z-index: 1;
    background: var(--carte);
    border: 1px solid var(--bord);
    border-radius: 20px;
    padding: 40px 32px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(44, 41, 38, 0.08);
    text-align: center;
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    from { transform: translateY(8px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  h1 {
    font-size: 1.5rem;
    margin: 0 0 10px;
    line-height: 1.35;
    font-weight: 700;
  }
  .sous-titre {
    font-size: 0.98rem;
    color: var(--gris);
    margin: 0 0 28px;
  }

  /* Zone des boutons oui/non */
  .zone-boutons {
    position: relative;
    display: flex;
    gap: 14px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    min-height: 60px;
    margin-top: 8px;
  }

  button {
    font-family: inherit;
    font-size: 1.02rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 14px 26px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  button:active { transform: scale(0.97); }

  .btn-oui {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 6px 16px rgba(239, 107, 77, 0.3);
  }
  .btn-oui:hover { background: var(--accent-fonce); }

  .btn-non {
    background: #efeae3;
    color: var(--gris);
  }

  /* Quand le "Non" fuit : positionné en fixe + glisse en douceur */
  .btn-non.fuit {
    position: fixed;
    z-index: 50;
    margin: 0;
    transition: left 0.25s cubic-bezier(.22,.61,.36,1), top 0.25s cubic-bezier(.22,.61,.36,1), background 0.15s ease;
  }

  /* Écrans */
  .ecran { display: none; }
  .ecran.actif { display: block; animation: pop 0.35s ease; }

  /* Formulaire */
  .champ { text-align: left; margin: 0 0 16px; }
  .champ label {
    display: block;
    font-weight: 600;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  .champ input, .champ textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 13px;
    border: 1px solid var(--bord);
    border-radius: 10px;
    background: #faf8f5;
    color: var(--texte);
  }
  .champ input:focus, .champ textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .champ textarea { resize: vertical; min-height: 64px; }

  .ligne-2 { display: flex; gap: 12px; }
  .ligne-2 .champ { flex: 1; }

  .btn-principal {
    background: var(--accent);
    color: #fff;
    width: 100%;
    margin-top: 6px;
    box-shadow: 0 6px 16px rgba(239, 107, 77, 0.3);
  }
  .btn-principal:hover { background: var(--accent-fonce); }

  .btn-secondaire {
    background: #efeae3;
    color: var(--texte);
    width: 100%;
    margin-top: 10px;
  }
  .btn-secondaire:hover { background: #e6e0d8; }

  .recap {
    background: #f7f4ef;
    border: 1px solid var(--bord);
    border-radius: 12px;
    padding: 18px;
    margin: 18px 0;
    font-size: 1rem;
    line-height: 1.55;
    text-align: left;
    white-space: pre-line;
  }

  .note {
    font-size: 0.82rem;
    color: var(--gris);
    margin-top: 14px;
  }

  .version {
    font-size: 0.72rem;
    color: #c2bcb2;
    margin: 18px 0 0;
    letter-spacing: 0.5px;
  }

  .copie-ok {
    color: var(--accent-fonce);
    font-weight: 600;
    font-size: 0.92rem;
    height: 20px;
    margin-top: 10px;
  }
</style>
</head>
<body>

  <div class="carte">

    <!-- ÉCRAN 1 : la question -->
    <div id="ecran-question" class="ecran actif">
      <h1>On se fait un date, toi et moi&nbsp;?</h1>
      <p class="sous-titre">Réponds honnêtement&nbsp;😄</p>
      <div class="zone-boutons" id="zone">
        <button class="btn-oui" id="btnOui">Oui</button>
        <button class="btn-non" id="btnNon">Non</button>
      </div>
    </div>

    <!-- ÉCRAN 2 : choix date et heure -->
    <div id="ecran-date" class="ecran">
      <h1>Ça marche&nbsp;! On cale ça quand&nbsp;?</h1>
      <p class="sous-titre">Propose ce qui t'arrange&nbsp;:</p>

      <div class="ligne-2">
        <div class="champ">
          <label for="dateInput">Le jour</label>
          <input type="date" id="dateInput" />
        </div>
        <div class="champ">
          <label for="heureInput">L'heure</label>
          <input type="time" id="heureInput" />
        </div>
      </div>

      <div class="champ">
        <label for="lieuInput">Une idée d'endroit ? (facultatif)</label>
        <input type="text" id="lieuInput" placeholder="Un café, un resto, une balade…" />
      </div>

      <div class="champ">
        <label for="motInput">Un mot à ajouter ? (facultatif)</label>
        <textarea id="motInput" placeholder="Écris ce que tu veux…"></textarea>
      </div>

      <button class="btn-principal" id="btnValider">Valider</button>
    </div>

    <!-- ÉCRAN 3 : confirmation + copier -->
    <div id="ecran-fin" class="ecran">
      <h1>C'est noté&nbsp;👌</h1>
      <p class="sous-titre">Copie ta réponse et envoie-la moi (Insta, Snap, SMS… comme tu veux)&nbsp;:</p>
      <div class="recap" id="recap"></div>
      <button class="btn-principal" id="btnSms">M'envoyer par SMS</button>
      <button class="btn-secondaire" id="btnCopier">Copier ma réponse</button>
      <div class="copie-ok" id="copieOk"></div>
      <p class="note">À bientôt&nbsp;!</p>
    </div>

    <p class="version">v2</p>

  </div>

<script>
  /* ---------- Le bouton "Non" qui glisse en s'éloignant ---------- */
  const btnNon = document.getElementById("btnNon");
  let aFui = false;

  function fuirDe(pointerX, pointerY) {
    // Première fuite : on fige sa position actuelle puis on bascule en "fixe"
    if (!aFui) {
      const r = btnNon.getBoundingClientRect();
      btnNon.classList.add("fuit");
      btnNon.style.left = r.left + "px";
      btnNon.style.top = r.top + "px";
      aFui = true;
    }

    const r = btnNon.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    // direction : du pointeur vers le bouton -> on pousse dans ce sens
    let dx = cx - pointerX;
    let dy = cy - pointerY;
    let dist = Math.hypot(dx, dy) || 1;
    dx /= dist; dy /= dist;

    const pas = 130; // distance de déplacement (glissement, pas téléportation)
    const marge = 8;
    const maxX = window.innerWidth - r.width - marge;
    const maxY = window.innerHeight - r.height - marge;

    let nx = r.left + dx * pas;
    let ny = r.top + dy * pas;

    // Si on tape un bord, on rebondit dans l'autre sens
    if (nx < marge || nx > maxX) nx = r.left - dx * pas;
    if (ny < marge || ny > maxY) ny = r.top - dy * pas;

    // clamp final
    nx = Math.min(Math.max(marge, nx), maxX);
    ny = Math.min(Math.max(marge, ny), maxY);

    btnNon.style.left = nx + "px";
    btnNon.style.top = ny + "px";

    const messages = ["Non", "Sûre ?", "Essaie encore", "Raté", "Trop lent", "Allez…", "Bien tenté"];
    btnNon.textContent = messages[Math.floor(Math.random() * messages.length)];
  }

  // PC : le bouton s'éloigne du curseur
  btnNon.addEventListener("mouseover", function (e) { fuirDe(e.clientX, e.clientY); });
  btnNon.addEventListener("mousemove", function (e) { fuirDe(e.clientX, e.clientY); });
  btnNon.addEventListener("click", function (e) { e.preventDefault(); fuirDe(e.clientX, e.clientY); });
  // Mobile : il glisse avant que le toucher n'aboutisse
  btnNon.addEventListener("touchstart", function (e) {
    e.preventDefault();
    const t = e.touches[0];
    fuirDe(t.clientX, t.clientY);
  }, { passive: false });

  /* ---------- Navigation entre écrans ---------- */
  function montrerEcran(id) {
    document.querySelectorAll(".ecran").forEach(function (el) { el.classList.remove("actif"); });
    document.getElementById(id).classList.add("actif");
    window.scrollTo(0, 0);
  }

  document.getElementById("btnOui").addEventListener("click", function () {
    montrerEcran("ecran-date");
  });

  /* ---------- Validation ---------- */
  function formaterDate(valeur) {
    if (!valeur) return null;
    const d = new Date(valeur + "T00:00:00");
    return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  }

  let texteReponse = "";

  document.getElementById("btnValider").addEventListener("click", function () {
    const dateVal = document.getElementById("dateInput").value;
    const heureVal = document.getElementById("heureInput").value;
    const lieuVal = document.getElementById("lieuInput").value.trim();
    const motVal = document.getElementById("motInput").value.trim();

    if (!dateVal || !heureVal) {
      alert("Choisis au moins un jour et une heure.");
      return;
    }

    const dateJolie = formaterDate(dateVal);

    // Message texte simple à copier
    texteReponse = "C'est oui pour notre date 🙂\n";
    texteReponse += "📅 " + dateJolie + "\n";
    texteReponse += "🕐 " + heureVal;
    if (lieuVal) texteReponse += "\n📍 " + lieuVal;
    if (motVal) texteReponse += "\n\n" + motVal;

    document.getElementById("recap").textContent = texteReponse;
    montrerEcran("ecran-fin");
  });

  /* ---------- Envoyer par SMS (vers mon numéro) ---------- */
  const MON_NUMERO = "+33783316707"; // 07 83 31 67 07

  document.getElementById("btnSms").addEventListener("click", function () {
    const corps = encodeURIComponent(texteReponse);
    // Syntaxe compatible iOS et Android
    window.location.href = "sms:" + MON_NUMERO + "?&body=" + corps;
  });

  /* ---------- Copier dans le presse-papier ---------- */
  document.getElementById("btnCopier").addEventListener("click", function () {
    const ok = document.getElementById("copieOk");

    function feedback() { ok.textContent = "Copié ✔  (colle-le et envoie-le moi)"; }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texteReponse).then(feedback).catch(copierFallback);
    } else {
      copierFallback();
    }

    function copierFallback() {
      const ta = document.createElement("textarea");
      ta.value = texteReponse;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand("copy"); feedback(); }
      catch (e) { ok.textContent = "Sélectionne le texte au-dessus et copie-le."; }
      document.body.removeChild(ta);
    }
  });
</script>
</body>
</html>
